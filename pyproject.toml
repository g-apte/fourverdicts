[project]
name = "fourverdicts"
version = "0.1.0"
description = "Four verdicts for governing agentic AI: allow, modify, require approval, deny. A reference edition by Advaita AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Advaita AI" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourverdicts"]
